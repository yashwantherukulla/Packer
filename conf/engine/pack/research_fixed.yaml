# Research-safe single-context carrier profile. Unlike learned BPE, byte-fixed
# cannot merge a tiny repository into one token. Keep corpus tokens <= context_len
# until the rolling-context training PR lands.
arch: tiny-decoder
tokenizer: byte-fixed
decode: teacher-forced-greedy
codec: delta-varint-v1
n_layers: 2
d_model: 64
n_heads: 2
vocab_size: 257
context_len: 1024
epochs: 200
lr: 0.001
batch_size: 1
weight_decay: 0.0
device: auto
deterministic: true
seed: 0
bos_token_id: 0
out_dir: ./outputs
min_sequence_tokens: 256
max_serialized_bytes_per_token: 1.0
