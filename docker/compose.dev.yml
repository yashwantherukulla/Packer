name: packer

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn packer.api.main:create_app --factory --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ../src:/app/src         # live source
      - ../conf:/app/conf

  worker-default:
    volumes:
      - ../src:/app/src
      - ../conf:/app/conf

  frontend:
    image: node:20-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
