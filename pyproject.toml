[project]
name = "packer"
version = "0.1.0"
description = "Store code in overfit transformer weights; detect and sandbox it."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "safetensors>=0.4",
  "huggingface-hub>=0.23",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pydantic>=2.7",
  "torch>=2.13.0",
  "tokenizers>=0.23.1",
  "docker>=7.1.0",
  "fastapi>=0.139.0",
  "uvicorn[standard]>=0.51.0",
  "celery>=5.6.3",
  "redis>=8.0.1",
  "sqlalchemy>=2.0.51",
  "alembic>=1.18.5",
  "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "import-linter>=2.0",
  "pre-commit>=3.7",
  "pytest-asyncio>=1.4.0",
  "httpx>=0.28.1",
  "testcontainers>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packer"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Test fixtures are data (e.g. planted-malware samples, .pak artifacts), not code:
# never lint or reformat them. `--force-exclude` on the hooks honors this even when
# pre-commit passes the paths explicitly.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

# The docker SDK ships incomplete type stubs; yara-python is an optional native
# dependency the scanner lazy-imports and degrades without; transformers is an
# optional lib the blind extractor lazy-imports for foreign models (degrades to a
# ReconstructionError when absent). All treated as Any.
[[tool.mypy.overrides]]
module = ["docker", "docker.*", "yara", "transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # make the repo-root `scripts` package importable in tests
# importlib import-mode: test modules are identified by path, so the same basename
# (e.g. test_config.py) can appear in multiple subsystem test dirs without collision.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
  "unit: fast, no external services",
  "integration: needs services",
  "e2e: full stack",
  "gpu: requires CUDA",
]

# --- Dependency Rule enforcement (SYSTEM-DESIGN §10) ---
# Contracts are introduced incrementally as their modules land (import-linter
# errors on any referenced module that doesn't exist). Phase 0 registers the
# framework-agnostic forbidden contract + a minimal layering over the packages
# that exist so far (common < models|artifacts). Later phases extend this
# toward the canonical end-state in DEVELOPMENT.md §3.1 (detect no-inference,
# the docker adapter carve-out, and the extract/sandbox/api layers).
[tool.importlinter]
root_package = "packer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine is framework-agnostic"
type = "forbidden"
source_modules = ["packer.engine"]
forbidden_modules = ["packer.api", "packer.workers", "docker", "redis", "sqlalchemy", "fastapi", "celery"]
# the ONE sanctioned adapter edge: the Docker sandbox runner may import docker.
ignore_imports = ["packer.engine.sandbox.adapters.docker -> docker"]

[[tool.importlinter.contracts]]
name = "detect runs no inference"
# import-linter can't forbid an external *subpackage* (torch.nn.functional), and
# detect is pure numpy/scipy anyway — so forbid all of torch: a stronger guarantee
# (detect is torch-free, hence inference-free) than the spec's nn.functional note.
type = "forbidden"
source_modules = ["packer.engine.detect"]
forbidden_modules = ["torch"]

[[tool.importlinter.contracts]]
name = "clean layering"          # high -> low; higher layers may import lower ones
type = "layers"
layers = [
  "packer.api",
  "packer.engine.sandbox",
  "packer.engine.extract",
  "packer.engine.pack | packer.engine.detect",
  "packer.engine.models | packer.engine.artifacts | packer.engine.report",
  "packer.engine.common",
]
