# ruff, ruff-format, and mypy run as LOCAL hooks via `uv run` so they use the
# exact versions pinned in uv.lock — identical to CI (`uv run ruff/mypy ...`).
# This avoids the hook-vs-CI drift that mirror `rev:` pins cause (e.g. RUF rules
# changing between ruff releases). Bump those tools with `uv lock --upgrade`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # .pak fixtures are byte-exact artifacts (round-trip is asserted); never rewrite them.
        exclude: ^tests/fixtures/.*\.pak/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/.*\.pak/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
        # Files that legitimately embed a (non-real, truncated) key header: the
        # Phase-3 plan, the secrets scanner's detection regex, and its test fixture.
        exclude: |
          (?x)^(
            docs/plans/2026-07-07-phase-3-extractor-sandbox\.md
            | src/packer/engine/sandbox/static/secrets\.py
            | tests/unit/sandbox/static/test_secrets\.py
          )$
